workflows:
  macos-capacity-probe:
    name: XCrypt Mac capacity probe
    instance_type: mac_mini_m2
    max_build_duration: 10
    scripts:
      - name: Check resources and arm64 compiler
        script: python3 ci/probe.py
    artifacts:
      - reports/report.json

  chromium-capacity-trial:
    name: Chromium capacity trial (up to 110 min)
    instance_type: mac_mini_m2
    max_build_duration: 110
    scripts:
      - name: Record machine resources
        script: python3 ci/probe.py
      - name: Fetch and try compiling Chromium
        script: python3 -u ci/chromium_trial.py
    artifacts:
      - reports/**
